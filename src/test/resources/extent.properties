#extent.properies
extent.reporter.spark.start=true 
extent.reporter.spark.config=/Cucumber/src/test/resources/spark-config.xml
extent.reporter.spark.out=test-output/SparkReports/ExtentSparkReport
extent.reporter.html.start=true
extent.reporter.spark.base64imagesrc=true

screenshot.dir=test-output/screenshots/
screenshot.rel.path=../screenshots/
#PDF Report
extent.reporter.pdf.start=true
extent.reporter.pdf.out=test-output/PdfReport/ExtentPdf.pdf
extent.reporter.spark.vieworder=dashboard,test,exception,author,device,log
systeminfo.os=windows
systeminfo.Engineer=Swapna
systeminfo.AppName=SalesForce Application
systeminfo.Browser=Google Chrome




##FolderName
basefolder.name=test-reports/reports
basefolder.datetimepattern=d-MMM-YY HH-mm-ss